# 绵阳血战麻将 —— Nginx 反向代理
#
# 放到 /etc/nginx/sites-available/mymj，然后：
#   sudo ln -sf /etc/nginx/sites-available/mymj /etc/nginx/sites-enabled/mymj
#   sudo nginx -t && sudo systemctl reload nginx
#
# 把 desktop.example.com 换成你的域名（或公网 IP，做纯 HTTP 反代时也能用 IP）。
#
# ⚠️ 三处不能删：Upgrade / Connection 两行 + TRUST_PROXY。
#    漏掉前两行的现象是「页面能打开、能登录，但一进房间就断线」；
#    漏掉 TRUST_PROXY 的现象是「一个人的操作把全站登录额度吃光」。

server {
    listen 80;
    server_name desktop.example.com;

    # 图片/语音走 STORAGE_DRIVER=local 时会经过这里上传（服务端单张限 5MB）
    client_max_body_size 8m;

    # 只让本机反代访问后端，别把 3000 暴露出去
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ↓↓↓ 实时通道（WebSocket）就靠这两行
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 牌局里会有长时间不说话的连接（等人出牌、托管），别让它被过早掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 不加缓存相关的 location：客户端模块不带内容哈希、URL 每次部署都不变，
    # 服务端已经给它们发了 Cache-Control: no-store，这里再套一层反而容易漏掉上面那些头。
}
